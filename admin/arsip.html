<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMA HABATA - Arsip & Laporan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --sidebar-color: #243b53;
            --bg-body: #dfe6eb;
            --accent-blue: #4a90e2;
            --dark-text: #2c3e50;
            --chart-bar: #3d4246;
        }

        body {
            background: var(--bg-body);
            font-family: "Segoe UI", Roboto, sans-serif;
            color: var(--dark-text);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: var(--sidebar-color);
            color: #fff;
            position: fixed;
            padding: 20px;
            z-index: 1000;
        }

        .sidebar h4 {
            font-weight: 800;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        .user-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

    
        /* --- CONTENT AREA --- */
       .content {
    margin-left: 0;
    padding: 40px;
}

@media (min-width: 992px) {
    .with-sidebar .content {
        margin-left: 240px;
    }
}


        .page-title {
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* --- STAT CARDS --- */
        .stat-card {
            background: #f8fafc;
            padding: 24px;
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
        }

        .stat-card-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-card small {
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-top: 5px;
        }

        .stat-card i {
            font-size: 24px;
            color: var(--accent-blue);
            background: rgba(74, 144, 226, 0.1);
            padding: 10px;
            border-radius: 12px;
        }

        /* --- CHART STYLES (DURASI RAPAT) --- */
        .chart-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            padding-left: 35px;
            margin-top: 10px;
        }

        .main-chart-area {
            position: relative;
            height: 150px;
            width: 100%;
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .grid-line {
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        .grid-line span {
            position: absolute;
            left: -35px;
            bottom: -8px;
            font-size: 11px;
            color: #94a3b8;
        }

        .bars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 2;
        }

        .bar-item {
            width: 18%;
            background-color: var(--chart-bar);
            border-radius: 4px 4px 0 0;
            transition: opacity 0.3s;
        }

        .bar-item:hover { opacity: 0.8; }

        .labels-container {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
        }

        .label-item {
            width: 18%;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        /* --- TABLE --- */
        .table-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .badge-finish {
            background: #fef08a;
            color: #854d0e;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-clear {
            background: #ef4444;
            color: #fff;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }

        .btn-clear:hover { background: #dc2626; }
        
        .stat-card.stat-small {
    min-height: 170px;   /* 🔥 ubah angka ini */
    padding: 24px;
}
.stat-value {
    margin-top: 60px;   /* 🔥 ubah ini */
}


    </style>
</head>
<body>

<div class="content">
    <h4 class="page-title">Arsip & Laporan</h4>

    <div class="row g-4 align-items-start">

        <div class="col-md-4">
            <div class="stat-card stat-small">
                <div class="stat-card-info">
                    <div>
                        <small>Total Rapat</small>
                        <div class="stat-value">132</div>
                    </div>
                    <i class="bi bi-calendar-event"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card stat-small">
                <div class="stat-card-info">
                    <div>
                        <small>Total Peserta</small>
                        <div class="stat-value">1,240</div>
                    </div>
                    <i class="bi bi-people-fill"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card stat-chart">
                <div class="chart-title">Durasi rata-rata rapat</div>
                <div class="chart-wrapper">
                    <div class="main-chart-area">
                        <div class="grid-lines">
                            <div class="grid-line"><span>20</span></div>
                            <div class="grid-line"><span>15</span></div>
                            <div class="grid-line"><span>10</span></div>
                            <div class="grid-line"><span>5</span></div>
                            <div class="grid-line" style="border:none"><span>0</span></div>
                        </div>
                        <div class="bars-container">
                            <div class="bar-item" style="height: 40%;"></div>
                            <div class="bar-item" style="height: 60%;"></div>
                            <div class="bar-item" style="height: 75%;"></div>
                            <div class="bar-item" style="height: 100%;"></div>
                        </div>
                    </div>
                    <div class="labels-container">
                        <div class="label-item">1 jam</div>
                        <div class="label-item">2 jam</div>
                        <div class="label-item">2,5 jam</div>
                        <div class="label-item">4 jam</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="table-card">
        <h6 class="fw-bold mb-4">Detail Arsip Rapat</h6>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="py-3">Nama Rapat</th>
                        <th class="py-3">Tanggal & Waktu</th>
                        <th class="py-3">Ruangan</th>
                        <th class="py-3 text-center">Peserta</th>
                        <th class="py-3 text-center">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-medium">Rapat Evaluasi Triwulan</td>
                        <td>25 April 2025, 09.00</td>
                        <td>Aula Utama</td>
                        <td class="text-center">35</td>
                        <td class="text-center"><span class="badge-finish">Selesai</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="text-end mt-3">
            <button class="btn-clear">Clear all</button>
        </div>
    </div>
</div>

</body>
</html>
